name: Monday refresh

# 06:00 UTC every Monday (07:00 BST, 06:00 in winter). Cron is always UTC.
# workflow_dispatch lets you start it by hand from the GitHub mobile app.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monday-refresh
  cancel-in-progress: false

jobs:
  # 1. Research and fact-check. Publishes nothing.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      base_blob: ${{ steps.base.outputs.blob }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Free, deterministic pass: which official pages published anything.
      # Cached so a failed run does not re-report the same links next week.
      - name: Restore what the watcher saw last week
        uses: actions/cache@v4
        with:
          path: .github/watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      # Remember which data.json this run started from, so publish can tell
      # whether anything else has touched it while the run waited for approval.
      - name: Note the dataset this run is based on
        id: base
        run: echo "blob=$(git rev-parse HEAD:data/data.json)" >> "$GITHUB_OUTPUT"

      - name: Check the primary sources and stage the update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5' }}
          # An identity-linked key is rejected outright without this.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_MAX_SEARCHES: ${{ vars.ANTHROPIC_MAX_SEARCHES || '10' }}
          ANTHROPIC_RUN_SEARCH_BUDGET: ${{ vars.ANTHROPIC_RUN_SEARCH_BUDGET || '70' }}
        run: python3 .github/refresh.py

      # The gate. If this fails, nothing is staged, so nothing can be approved.
      - name: Validate
        run: python3 .github/validate_data.py

      - name: Did anything change
        id: diff
        run: |
          if git diff --quiet -- data/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Put the report in the run summary
        if: always()
        run: cat refresh-report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Keep the staged dataset for the publish step
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staged-data
          path: |
            data/data.json
            refresh-report.md
            .github/watch-state.json
          retention-days: 7

      - name: Raise an issue if the refresh broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Monday refresh failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Nothing was published. The tracker still shows last week's verified data.\n\n[Run log](${url})\n\nUsual causes: the ANTHROPIC_API_KEY secret is missing or expired, the ANTHROPIC_MODEL name is stale, or the validator rejected the staged data.`
            });

  # 2. Waits for your approval, then pushes. Netlify deploys on the push.
  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: publish          # <- the approval gate lives here
    steps:
      # main, not the commit the run started from. A run can sit waiting for
      # approval for hours, and checkout@v4 would otherwise pin it to a commit
      # that is no longer the tip, so the push is rejected as non-fast-forward.
      # That is exactly how the 1 September run failed.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: staged-data
          path: staged

      - name: Publish
        env:
          BASE_BLOB: ${{ needs.prepare.outputs.base_blob }}
        run: |
          set -euo pipefail
          git config user.name  "EcoLedger refresh"
          git config user.email "action@github.com"
          git fetch origin main
          git checkout -B main origin/main

          # Moving to the tip of main is safe only if nobody else changed the
          # dataset in the meantime. If they did, this artifact was built on a
          # version that no longer exists and publishing it would silently undo
          # their work, so stop and say so.
          NOW_BLOB=$(git rev-parse HEAD:data/data.json)
          if [ -n "${BASE_BLOB:-}" ] && [ "$NOW_BLOB" != "$BASE_BLOB" ]; then
            echo "::error::data/data.json changed on main while this run waited for approval."
            echo "This staged refresh was built on $BASE_BLOB but main now has $NOW_BLOB."
            echo "Nothing published. Re-run the refresh so it works from current data."
            exit 1
          fi

          cp staged/data/data.json data/data.json
          [ -f staged/.github/watch-state.json ] && cp staged/.github/watch-state.json .github/watch-state.json || true
          rm -rf staged

          git add data/data.json
          git add .github/watch-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to publish: main already holds this data."
            exit 0
          fi
          git commit -m "Monday refresh $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
